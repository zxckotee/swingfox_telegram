name: CI/CD Telegram Bot (staging)

on:
  push:
    branches:
      - stagging
      - cursor/swingfox-telegram-interface-2a4a
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy telegram bot to staging host
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -e

            DEPLOY_PATH="/root/swingfox_telegram-staging"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            echo "============================================"
            echo "  Telegram bot STAGING — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "  Branch: $BRANCH"
            echo "============================================"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            export TELEGRAM_SECRET='${{ secrets.TELEGRAM_SECRET_STAGING }}'
            export TELEGRAM_BOT_SHARED_SECRET='${{ secrets.TELEGRAM_BOT_SHARED_SECRET_STAGING }}'
            export SWINGFOX_API_URL='${{ secrets.SWINGFOX_API_URL_STAGING }}'
            export SWINGFOX_UPLOADS_URL='${{ secrets.SWINGFOX_UPLOADS_URL_STAGING }}'
            export PUBLIC_WEB_URL='${{ secrets.PUBLIC_WEB_URL_STAGING }}'

            bash scripts/write-env-from-ci.sh "$DEPLOY_PATH"

            docker network inspect swingfox-staging_default >/dev/null 2>&1 \
              || { echo "ERROR: network swingfox-staging_default not found. Deploy swingfox staging first."; exit 1; }

            docker compose -p swingfox-telegram-staging -f docker-compose.staging.yml up -d --build --remove-orphans
            docker compose -p swingfox-telegram-staging -f docker-compose.staging.yml ps

            echo "Telegram bot staging deploy complete"
