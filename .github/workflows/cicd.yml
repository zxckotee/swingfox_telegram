name: CI/CD Telegram Bot

on:
  push:
    branches:
      - master
      - prod3
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка для деплоя (пусто = ветка запуска workflow)"
        required: false
        type: string
        default: "master"
      skip_build:
        description: "Не пересобирать образ (только docker compose up)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy telegram bot (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 12m
          script: |
            set -e

            DEPLOY_PATH="/root/swingfox_telegram"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            INPUT_BRANCH='${{ github.event.inputs.branch }}'
            if [ -n "$INPUT_BRANCH" ]; then
              BRANCH="$INPUT_BRANCH"
            else
              BRANCH="${{ github.ref_name }}"
            fi
            SKIP_BUILD='${{ github.event.inputs.skip_build }}'

            echo "============================================"
            echo "  Telegram bot deploy — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "  Trigger: ${{ github.event_name }}"
            echo "  Branch:  $BRANCH"
            echo "  Path:    $DEPLOY_PATH"
            echo "============================================"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            export TELEGRAM_SECRET='${{ secrets.TELEGRAM_SECRET }}'
            export TELEGRAM_BOT_SHARED_SECRET='${{ secrets.TELEGRAM_BOT_SHARED_SECRET }}'
            export SWINGFOX_API_URL='http://backend:3001/api'
            export SWINGFOX_UPLOADS_URL='https://swingfox.ru/uploads'
            export PUBLIC_WEB_URL='https://swingfox.ru'

            bash scripts/write-env-from-ci.sh "$DEPLOY_PATH"

            docker network inspect swingfox_default >/dev/null 2>&1 \
              || { echo "ERROR: network swingfox_default not found. Deploy swingfox first."; exit 1; }

            if [ "$SKIP_BUILD" = "true" ]; then
              docker compose -f docker-compose.yml up -d --remove-orphans
            else
              docker compose -f docker-compose.yml up -d --build --remove-orphans
            fi
            docker compose -f docker-compose.yml ps

            echo "Telegram bot deploy complete"
