# Production bot on the same host as swingfox.
# Uses host network (like legacy python main.py) so api.telegram.org is reachable
# when Docker bridge network is blocked/unstable.
#
# Usage:
#   cd /root/swingfox_telegram
#   docker-compose up -d --build

services:
  telegram-bot:
    build: .
    container_name: swingfox_telegram_bot
    restart: unless-stopped
    network_mode: host
    environment:
      TELEGRAM_SECRET: ${TELEGRAM_SECRET}
      TELEGRAM_BOT_SHARED_SECRET: ${TELEGRAM_BOT_SHARED_SECRET}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PRODUCTION: ${PRODUCTION:-on}
      SWINGFOX_API_URL: ${SWINGFOX_API_URL:-}
      SWINGFOX_UPLOADS_URL: ${SWINGFOX_UPLOADS_URL:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      SESSION_DB_PATH: /app/data/sessions.db
    volumes:
      - ./data:/app/data
