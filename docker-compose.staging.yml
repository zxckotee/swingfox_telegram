# Staging: same host, swingfox-staging stack network.
#
# Usage:
#   docker compose -p swingfox-telegram-staging -f docker-compose.staging.yml up -d --build

services:
  telegram-bot:
    build: .
    container_name: swingfox_telegram_bot_staging
    restart: unless-stopped
    environment:
      TELEGRAM_SECRET: ${TELEGRAM_SECRET}
      TELEGRAM_BOT_SHARED_SECRET: ${TELEGRAM_BOT_SHARED_SECRET}
      SWINGFOX_API_URL: ${SWINGFOX_API_URL:-http://backend:3001/api}
      SWINGFOX_UPLOADS_URL: ${SWINGFOX_UPLOADS_URL:-https://swingfox.ru/stagging/uploads}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://swingfox.ru/stagging}
    networks:
      - swingfox_staging_default

networks:
  swingfox_staging_default:
    external: true
